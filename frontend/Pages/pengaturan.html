<main class="content">
    <div class="card settings-card">

        <div class="settings-head">
            <div class="profile-top">
                <div>
                    <h1>Pengaturan Profil &amp; Akun</h1>
                    <p>Kelola informasi profil dan keamanan akun Anda.</p>
                </div>
            </div>
            <button type="button" class="btn-soft" id="editProfile">Edit Profil</button>
        </div>

        <section class="s-section">
            <h2>Informasi Pribadi</h2>
            <div class="s-grid">
                <div class="s-item">
                    <span class="s-label">Nama Lengkap</span>
                    <span class="s-value" id="dispName">Memuat...</span>
                </div>
                <div class="s-item">
                    <span class="s-label">NPM</span>
                    <span class="s-value" id="dispNpm">Memuat...</span>
                </div>
                <div class="s-item">
                    <span class="s-label">Alamat Email</span>
                    <span class="s-value" id="dispEmail">Memuat...</span>
                </div>
                <div class="s-item">
                    <span class="s-label">Nomor Telepon</span>
                    <span class="s-value" id="dispPhone">Memuat...</span>
                </div>
                <div class="s-item span-2">
                    <span class="s-label s-bold">Program Studi</span>
                    <div class="value-box" id="dispProdi">Memuat...</div>
                </div>
            </div>
        </section>

        <section class="s-section">
            <h2>Informasi Akun</h2>
            <div class="s-grid">
                <div class="s-item">
                    <span class="s-label">Peran</span>
                    <span class="s-value" id="dispRole">Memuat...</span>
                </div>
                <div class="s-item">
                    <span class="s-label s-bold">Status Akun</span>
                    <div class="status-box">
                        <span class="p-dot" id="dispStatusDot"></span>
                        <b id="dispStatus">Memuat...</b>
                    </div>
                </div>
            </div>
        </section>

        <section class="s-section">
            <h2>Aktivitas Login</h2>
            <div class="s-item">
                <span class="s-label s-bold">Terakhir Login</span>
                <span class="s-value" id="dispLastLogin">Memuat...</span>
            </div>
        </section>

    </div>

</main>
