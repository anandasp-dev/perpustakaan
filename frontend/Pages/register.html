<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../Style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card-register">

        <!-- Header Section -->
        <div class="card-header-register">
            <h1>Your story starts here.</h1>
            <p class="deskripsi-form-register">Bergabunglah dengan komunitas dengan penuh rasa ingin tahu. Buat akun untuk menjelajah, meminjam, dan menjadi bagian darinya.</p>

            <!-- Tab Switcher -->
            <div class="tab-container">
                <a href="login.html" class="tab-active">Login</a>
                <a href="register.html" class="tab-register" aria-current="page">Register</a>
            </div>
        </div>

        <!-- Main Form Section -->
        <form id="formRegister" class="main-section">

            <div class="form-group">
                <label for="username" class="form-fullName">Username</label>
                <input type="text" id="username" name="username" placeholder="budi_santoso"
                       autocomplete="username" maxlength="50" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com"
                       autocomplete="email" maxlength="255" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                           autocomplete="new-password" maxlength="128" required aria-describedby="passwordHint">
                    <!-- Ikon mata untuk show/hide password -->
                    <i class="fa-regular fa-eye-slash" id="togglePassword"></i>
                </div>
                <label id="passwordHint" class="deskripsi-password-register">Use at least 8 characters</label>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" required> I agree to the Terms &amp; Privacy Policy
                </label>
            </div>

            <!-- Pesan error/sukses dari server -->
            <p id="errorMessage" role="alert" hidden></p>

            <button type="submit" class="btn-login">Register</button>

        </form>

        <!-- Footer Section -->
        <div class="footer">
            <p class="footer-deskripsi">Already a member? <a href="login.html">Login <i class="fa-solid fa-arrow-right"></i></a></p>

            <div class="trust-badge">
                <i class="fa-solid fa-leaf"></i>
                <span>Free Membership. Endless Possibilities</span>
            </div>
        </div>

    </div>

    <script src="../Js/js.js"></script>
    <script src="../Js/register.js"></script>
</body>
</html>
